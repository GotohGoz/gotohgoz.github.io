      rol: "Diseño de Personajes"
  tipo: "Manga"
  categoria:
  - "Recomendaciones"
  generos:
    - "Girls Love"
    - "Fantasía"
    - "Isekai"
    - "Comedia Romántica"
  estado: "En serialización"
  imagen: "/assets/images/animanga/WataOshi.jpg"
  enlace: "https://myanimelist.net/manga/129361/Watashi_no_Oshi_wa_Akuyaku_Reijou"
  comentario:
    - >
      Rae es una oficinsta promedio, salvo por su obsesión con el *otome* *Revolution*, en específico, con la villana de este juego (de ahí el nombre no?), y como buen isekai, tenemos
      que Rae un día se despierta y se encuentra dentro de este mundo. Como es un juego de romance hetero, Rae deberá de esquivar a los protagonistas lo más que pueda para poder
      *simpear* tranquilamente a su adorada Claire, quien la odia como un gato a un ratón, pero esto no es problema para nuestra protagista que ya sabe esto y se conoce el juego
      al dedillo.
    - >
      La verdad es que la evolución de la relación entre Rae y Claire se siente bastante suave y natural, y esto (o el hecho de que Rae no está siguiendo el *script* del juego
      original) lleva a que el mundo que pensaba conocer totalmente empiece a cambiar de formas bastante drásticas.
    - >
      Esta es una lectura un poco lenta la verdad, pero si debo de destacar el *world building* que tenemos en este manga, está bastante bien logrado en especial todo el tema de la
      política. 

- titulo: "ぐらんぶる (Grand Blue)"
  orden: "guranburu"
  creditos:
    - nombre: "井上 堅二 (Inoue Kenji)"
      rol: "Historia"
    - nombre: "吉岡 公威 (Yoshioka Kimitake)"
      rol: "Dibujo"
  tipo: "Manga"
  categoria:
  - "Favoritos"
  generos:
    - "Comedia"
    - "Slice of Life"
  estado: "En serialización"
  imagen: "/assets/images/animanga/Grand Blue.jpg"
  enlace: "https://myanimelist.net/manga/70345/Grand_Blue"
  comentario:
    - >
      En este manga seguiremos la vida universitaria de Iori, que parte viendo a un grupo de borrachos en la tienda de su casa jugando desnudos. El humor que maneja la serie es de lo
      mejor que he visto y encuentro complicado que no te haga reir en algún momento, pero aún así tiene una narrativa bastante interesante que va conectando escenas de humor total,
      alcohol y mucha ridiculuzación, con momentos más serios que nos permiten apreciar a los personajes y observar su evolución... para después verlos bebiendo como si no hubiera un
      mañana.
    - >
      Iori vive en una tienda de buceo, y es parte del club de buceo de su universidad, por lo que este tema es muy recurrente y forma parte fundamental de la trama, lo menciono porque
      además de darte cuenta apenas empiezas a leer, es una introducción bastante completa al *hobby* como tal, puede que empieces a leer con ganas de reirte y salgas con un nuevo
      interés que además es bastante sano y bonito (aunque caro).
    - >
      Pero algo que sin duda es lo más bonito *Grand Blue* es el arte, Yoshioka nos deleita con planos a doble página llenos de detalle, un conocimiento total de la anatomía que le
      permite deformar y exagerar las caras para lograr un efecto cómico que funciona a las mil maravillas. No tengo suficientes palabras para definir el nivel de calidad que tiene
      el dibujo aquí, solo hazte el favor y leelo.