- titulo: "わたしが恋人になれるわけないじゃん、ムリムリ！（※ムリじゃなかった!?）(There's No Freaking Way I'll be Your Lover! Unless...)"
  orden: "わたしがこいびとになれるわけないじゃん"
  creditos:
    - nombre: "みかみ てれん (Mikami Teren)"
      rol: "Novela Ligera Original"

    - nombre: "むっしゅ (Musshu)"
      rol: "Dibujo"

    - nombre: "竹嶋 えく (Takeshima Eku)"
      rol: "Diseño de personajes"
  tipo: "Manga"
  categoria:
    - "Recomendaciones"
  generos:
    - "Yuri"
    - "Comedia romántica"
    - "Harem"
    - "Escolar"
  estado: "En serialización"
  imagen: "/assets/images/animanga/Watanare.jpg"
  enlace: "https://myanimelist.net/manga/128538/Watashi_ga_Koibito_ni_Nareru_Wake_Nai_jan_Muri_Muri_%E2%80%BBMuri_ja_Nakatta"
  comentario: 
    - >
      Si hay algo que deba decir para el género de romance en general, es que el "me salvaste, no te conozco de nada pero ahora te amo" es un bodrio catedralicio. Algo parecido tenemos
      aquí, aunque tiene algunos puntos positivos y que me llevan a recomendarla, y es que pasa como agua y te deja con esa sensación de querer más al terminar cada capítulo.
    - >
      La historia va de Renako, una chica que entra en la preparatoria y lo único que quiere es tener una vida normal y ser una chica del montón (las razones de esto se explican más
      adelante), lamentablemente sus planes se ven frustrados luego de que enamora a Mai, una chica de su grupo de amigas y la más popular del colegio. Y la cosa no termina ahí, porque 
      claramente todas las chicas de su grupo terminarán enamorándose de ella tarde o temprano, pero Renako insiste en que a ella no le gustan las chicas (cuando lo único que hace
      es tener pensamientos lésbicos con sus amigas).
    - >
      Si hay algo que me gusta, y es el mayor punto que tiene a favor para recomendarla, es la historia, porque logra atraparte muy fuerte en sus personajes. Renako como tal puede
      llegar a dar mucha rabia por lo indecisa que es y algunas decisiones cuestinables que toma a lo largo de la trama, pero en gran medida se retrata como una persona con la que es
      fácil simpatizar, y eso aplica a cada una de las heroínas, todaas tienen sus propios problemas y no Renako no viene a solucionarselos magicamente, pero si logra guiarlas al buen
      camino, y en el proceso se ayuda a si misma.
    - >
      Además de todo lo ya mencionado, soy muy fan del estilo artístico que tiene el manga, le da un vibra muy *chill* como dirían los lolos, pero obviamente las ilustraciones de la 
      novela ligera original son muchísimo mejores. Ah, y también tiene buen humor, a ratos.
    - >
      Si buscas algo tranquilo, que no te queme mucho la cabeza, sea relativamente fácil de digerir y sea Yuri, no busques más que Renako y compañia llegaron a tu rescate.

- titulo: "BanG Dream! It's MyGO!!!!!"
  orden: "bang dream its mygo"
  creditos:
    - nombre: "Bushiroad"
      rol: "Creadores"
  tipo: "Anime"
  categoria:
    - "Favoritos"
  generos:
    - "Drama"
    - "Música"
    - "Escolar"
  estado: "Finalizado (13 episodios)"
  imagen: "/assets/images/animanga/MyGO!!!!!.jpg"
  enlace: "https://myanimelist.net/anime/54959/BanG_Dream_Its_MyGO"
  comentario: 
    - >
      Con este anime me inicié en el mundo de *Bandori*, y quizás me esté perdiendo alguna joyita en las entregas anteriores, pero es que *It's MyGO!!!!!* tiene que ser uno de los
      mejores animes que he visto. En un inicio no le tenía mucha fé a que fuera animado con CGI, pero el resultado final tiene una calidad tremenda y un muy buen uso de los modelos
      3D para lograr efectos que en animación tradicional serían complicados de hacer (más que nada con el juego de expresiones faciales).
    - >
      Pero no se queda solo en temas de animación, la historia introduce dos bandas principales y todos los problemas que genera el no poder dejar atrás el pasado, el miedo a intentarlo
      una vez más o el querer escapar de todo, entre otros, todo vivido por chicas de preparatoria que se encuentran perdidas, sin un rumbo fijo y sin mucha idea de que hacer de ellas.
      Y el climax final es que tampoco debes tener todo solucionado hoy, puedes seguir perdidx y aún así seguir adelante, obviamente estoy cortando mucho del desarrollo porque tampoco 
      la idea tirarme 20 párrafos hablando de la historia (quizás lo haga en un video o post dedicado), pero en definitiva es una historia muy bien escrita y llena de pequeños detalles
      que no nutren solamente a las protagonistas, sino también al mundo que rodea la franquicia sin la necesidad de haber visto las entregas anteriores.
    - >
      La única pega que le encuentro están en los personajes de Soyo y Raana. Soyo se me hace muy desagradable y doble cara, al final esa es su función dentro de la historia, pero no 
      logro ver un desarrollo claro hasta más avanzada la historia (Ave Mujica), y Raana no siento que aporte realmente nada como personaje, tiene su papel dentro de la dinámica del
      grupo, pero como persona aparte no siento que tenga mucha chicha. A su vez, me veo en la obligación moral y legal de afirmar que mi opinión está basada únicamente en este anime
      y su secuela, tengo entendido que hay una película que ahonda un poco más en el personaje de la *stray cat* y un manga que narra los acontecimientos de esta serie desde la perspectiva
      de Soyo, por lo que mi opinión puede cambiar luego de ver y leer dichos extras.
    - >
      Como ya mencioné un poco, esta serie tiene una secuela, y tampoco se queda atrás en niveles de calidad. Es más, si tuviera que definirla en una palabra, sería...

- titulo: "上伊那ぼたん、酔へる姿は百合の花 (Botan Kamiina Fully Blossoms When Drunk)"
  orden: "かみいなぼたんよえるすがた"
  creditos: 
    - nombre: "塀 (Hey)"
      rol: "Manga Original"
    - nombre: "株式会社ソワネ (Soigne Co., Ltd.)"
      rol: "Adaptación"
  tipo: "Anime"
  categoria:
    - "Favoritos"
  generos:
    - "GL"
    - "Comedia"
  estado: "Finalizado (12 episodios)"
  imagen: "/assets/images/animanga/Botan.webp"
  enlace: "https://myanimelist.net/anime/61186/Kamiina_Botan_Yoeru_Sugata_wa_Yuri_no_Hana"
  comentario: 
    - >
      Me gusta el manga y puedo recomendarlo también, pero la adaptación es preciosa en cuanto a animación y escenografía. Los varios estilos de animación que se utilizan le dan un dinamismo 
      único y una forma cambiante de contar la historia con el pasar de los capítulos, sin mencionar que tanto la selección de canción como la animación para el opening son perfectas y dan 
      una sensación de nostalgia que queda redonda con todo el setup que ofrece esta obra. Además, la inclusión de pequeñas historias de las protagonistas en cada ending dan una capa extra 
      de profundidad a sus personajes y es un toque extra que se agradece mucho.
    - >
      He hablado mucho de la animación y tal, pero en historia tampoco se queda corta. Seguimos a varias chicas que viven en la misma residencia universitaria mientras se desarrollan sus 
      relaciones amorosas, con altos y bajos. Esta obra tiene varios frentes y todos los aborda de una muy buena manera, sin ser excesivamente seria pero tampoco tomándose a la ligera, 
      es un buen balance entre adulto y llevadero. Aún así extraño la sección de recomendaciones de películas en el cuaderno de la residencia que se ve al final de los capítulos del manga,
      como aporte cultural dentro del contexto quedaría muy bien en mi opinión.
    - >
      La única pega que le pongo es que se centra demasiado en el alcohol, entiendo que es parte de la gracia de la obra original, pero para alguien como yo que no está muy interesado ni 
      conoce mucho sobre alcohol puede llegar a ser un poco mucho.
    - >
      Sin duda muy recomendado para disfrutarlo con calma y buen ritmo, como catar un buen vino. 
    
- titulo: "ゆるゆり (YuruYuri)"
  orden: "ゆるゆり"
  creditos:
    - nombre: "なもり (Namori)"
      rol: "Manga Original"
    - nombre: "株式会社動画工房 (Doga Kobo, Inc.)"
      rol: "Adaptación"
  tipo: "Anime"
  categoria:
    - "Favoritos"
  generos:
    - "Yuri"
    - "Comedia"
    - "Slice of Life"
    - "Escolar"
  estado: "Finalizado (3 temporadas de 12 episodios + 2 OVAs + 2 Especiales)"
  imagen: "/assets/images/animanga/YuruYuri.webp"
  enlace: "https://myanimelist.net/anime/10495/Yuru_Yuri"
  comentario:
    - >
      Si hablamos del género "chicas lindas haciendo cosas lindas", *YuruYuri* es la obra por antonomasia en mi opinión. Sus personajes tienen rasgos muy característicos, que sumado al
      estilo que tiene Namori para una serie muy divertida, de las que te ayudan a desconectar un poco de la horrible realidad adulta jaja.
    - >
      La frase "chicas lindas haciendo cosas lindas" puede sonar a que no tiene mucha esencia, pero ese es el punto, no tiene que tener un mundo muy construido ni un desarrollo asombroso,
      si en algo destaca *YuruYuri* para mi, es en la forma que aprovecha muy bien las cualidades únicas de cada una de sus protagonistas. El mejor ejemplo de esto es Akari, su gag especial
      es que no destaca en nada, si no fuera por los dangos que trae en la cabeza ni su diseño desentonaría dentro del cast, y es algo de lo que se saca mucho jugo a lo largo de los capítulos.
    - >
      No sonará a mucho, pero cuando estás cansadx de todo y pensar en el mañana solo te trae estrés y ansiedad, poder disfrutrar de algo de este estilo puede ser muy beneficioso. Para mi
      *YuruYuri* es algo más que solo un manga y anime, le tengo mucho cariño a sus personajes y la llevo siguiendo desde hace años, por lo que quizás parte de mi cariño a la serie afecta mi
      juicio objetivo, pero no hay mejor *Slice of Life* en mi humilde opinión, que sea *yuri* también.

- titulo: "BanG Dream! Ave Mujica - The Die is Cast"
  orden: "bang dream its mygo1"
  creditos:
    - nombre: "Bushiroad"
      rol: "Creadores"
  tipo: "Anime"
  categoria:
    - "Favoritos"
  generos:
    - "Drama"
    - "Música"
    - "Psicológico"
    - "Escolar"
  estado: "Finalizado (13 episodios)"
  imagen: "/assets/images/animanga/AveMujica.jpg"
  enlace: "https://myanimelist.net/anime/56653/BanG_Dream_Ave_Mujica"
  comentario: 
    - >
      Locura, total y absoluta locura. Podría definirse como la versión mala de *MyGO!!!!!*, en el sentido de que, si en la precuela al final todo termina saliendo bien y solucionandose,
      dentro de lo que cabe, en *Ave Mujica* todo se va al garete muy rápido, es como una montaña rusa que después de la primera subida no deja de bajar hasta llegar bajo tierra...
      y aún así sigue bajando.
    - >
      En la entrega pasada se dan pinceladas sutiles (y no tanto) al tema de problemas y aflicciones mentales, mientras que acá pareciera que si no estás mal de la cabeza no puedes
      ser parte de la banda. Es un vaivén de emociones muy fuertes y un tour de 13 capítulos para apreciar como todas las integrantes se van rompiendo en mayor o menor medida, todo 
      para culminar en un final que no me dejo un muy buen sabor de boca en lo personal, y me imagino que esa era la intención. Porque entre *MyGO!!!!!* y *Ave Mujica* aún hay temas
      que resolver, y en general los personajes tienen pinta de que aún tienen más para dar, y es ahí donde entra la película que ya está próxima a salir, solo espero que pueda dar
      un buen cierre (no bueno de feliz, sino que no deje mal sabor de boca) a estas chicas, en caso de que sea la última vez que las veamos animadas, nunca se sabe.

- titulo: "炎炎ノ消防隊 (Fire Force)"
  orden: "enen no shouboutai"
  creditos:
    - nombre: "大久保 篤 (Ohkubo Atsushi)"
      rol: "Historia y Dibujo"
  tipo: "Manga"
  categoria:
    - "Recomendaciones"
  generos:
    - "Shounen"
    - "Acción"
    - "Ciencia Ficción"
    - "Aventura"
    - "Fantasía Oscura"
  estado: "Finalizado (304 capítulos compilados en 34 tomos)"
  imagen: "/assets/images/animanga/Fire Force.jpg"
  enlace: "https://myanimelist.net/manga/91037/Enen_no_Shouboutai"
  comentario: 
    - >
      Un shounen muy shounen diría, no es que sea la divina papaya y la verdad es que cuenta con varios huecos argumentales (en especial durante los últimos capitulos) que intenta 
      arreglar con una especie de "reinicio" que no termino de entender, pero da buen paso a su otra obra magna *Soul Eater* si es que te termina gustando. No destaca mucho y es bastante
      normalito en mi opinión, pero tiene una de las mejores peleas que he tenido el placer de ver (Arthur vs Dragon).

    - >
      Aún así la recomiendo porque tiene un mundo muy interesante y hace unas cosas que, si bien no termina de desarrollar o explicar del todo, siguen siendo muy interesantes de ver
      en este arquetipo de mangas. Además, la calidad del dibujo que entrega Ohkubo pese a ser una serie semanal es increible y muy respetable. Como manga para leer si es que no tienes
      nada mejor que hacer está bastante bien.
    - >
      Gran punto negativo (aplica a la demografía en general), el uso y abuso del fan service, en especial cuando hablamos de Tamaki. Ella tenía un potencial tremendo como personaje
      secundario, y hasta pareciera que Ohkubo se da cuenta más avanzada la historia, pero decide seguir utilizandola unicamente como objeto a sexualizar. Es triste porque si daba para
      mucho más teniendo en cuenta su historia y el poder que tiene guardado, pero bueno, hay que vender tomos para pagar las cuentas.

- titulo: "よつばと！ (Yotsuba &!)"
  orden: "yotsuba"
  creditos:
    - nombre: "あずま きよひこ (Azuma Kiyohiko)"
      rol: "Historia y Dibujo"
  tipo: "Manga"
  categoria:
    - "Favoritos"
  generos:
    - "Comedia"
    - "Slice of Life"
  estado: "En serialización"
  imagen: "/assets/images/animanga/Yotsuba.jpg"
  enlace: "https://myanimelist.net/manga/104/Yotsuba_to"
  comentario: 
    - >
      La reina indiscutible del género *Slice of Life* y no permitiré que nadie me lo refute. Yotsuba es una niña curiosa, alegre y muy carismática, en este manga seguiremos su 
      historia cuando se muda a un nuevo barrio, como se hace amiga de cualquier persona, como descubre y aprende del mundo, y naturalmente veremos también cuando se manda alguna que
      otra cagada, pero se lo perdonas porque sabes que en el fondo ella no lo hacía con mala intención (a veces).
    - >
      Es una historia que se centra en las cosas pequeñas y simples de la vida, y como pueden parecer increíbles bajo el prisma de quien no sabe y se fascina con todo. Ir a la tienda
      de la esquina, ir a la casa de la vecina, comprar una bicicleta y más, cosas que mundanas y que pueden esconder aventuras, risas, una enseñanza, o simplemente apreciación.
      Porque no debemos de centrarnos únicamente en perseguir nuestras metas y sueños, a veces es bueno parar y observar tus alrededores, ver todo lo que has logrado o simplemente
      agradacer que pudiste ver el sol un día más. Yotsuba esconde un mensaje muy lindo bajo una historia inocente que no busca que te deslumbres por su complejidad narrativa, todo lo
      contrario, y lo logra de maravilla.
    - >
      Personajes llenos de personalidad y carisma, pero que no dejan de ser personas de lo más corrientes, en un mundo de lo más corriente, como lo es el Japón de inicios de los 2000.
      No hace falta mucho más para mostrar que incluso las cosas que se te hacen más sencillas y aburridas, en algún momento fueron innovadoras.
    - >
      Déjate llevar por la brisa, para a decansar y relájate un rato con este manga, que de seguro te llevarás no solo unas buenas risas, sino también una sensación de alivianamiento
      en tu mente y en tu corazón.

- titulo: "やがて君になる (Bloom Into You)"
  orden: "bloom into you"
  creditos:
    - nombre: "仲谷 鳰 (Nakatani Nio)"
      rol: "Historia y Dibujo"
  tipo: "Manga"
  categoria:
  - "Favoritos"
  generos:
    - "Girls Love"
    - "Drama"
    - "Escolar"
  estado: "Finalizado (50 capítulos compilados en 8 tomos + 2 antologías + 1 novela ligera)"
  imagen: "/assets/images/animanga/Bloom Into You.jpg"
  enlace: "https://myanimelist.net/manga/88660/Yagate_Kimi_ni_Naru"
  comentario:
    - >
      Nunca he creído en el amor a primera vista, y eso es justo lo que tenemos en aquí pero elevado a la décima potencia. Yuu nunca ha sentido amor y cree que es incapaz de enamorarse,
      por lo que vive su vida con ese pensamiento rondando por su cabeza, hasta que esta misma característica enamora completamente a Touko, la presidenta del consejo estudiantil. 
      Naturalmente Yuu no entiende nada, cómo se supone que alguien a quien apenas conoces se enamora de ti? Y además esa misma persona quiere que tu no te enamores de ella y es feliz
      simplemente teniendo una relación unidireccional... es una premisa que no me llamó en lo absoluto, pero que es desarrollada de manera magistral.
    - >
      La pareja principal de Yuu y Touko tienen sus problemas y dilemas personales que iremos descubriendo conforme avanza la historia. Estos problemas afectan sus respectivas formas 
      de vivir, hasta que llega un punto en el que chocan y ambas deben de enfrentarse a una realidad que por mucho tiempo estuvieron evadiendo mientras se mentían a si mismas para 
      autoconvencerse de que estaban en lo correcto.
    - > 
      Estoy siendo vago a propósito porque quiero que lo lean (y porque a fecha de escrito esto la última releida que le di fue hace un par de meses, y aparte quiero hacerle un vídeo),
      no es muy largo y tiene algo que he visto muy poco, un mundo y una historia que se aprovecha al completo y te deja satisfecho. La historia cierra todos los cabos sueltos que 
      se presentan de buena manera, excepto por uno que se desarrolla en una novela ligera aparte, y si quedas con ganas de 
      más después de la historia principal, tienes 2 antologías ubicadas en dos momentos temporales distintos, y cuando terminas todo lo que hay por leer lo único que sientes es lo mismo
      que describe Nakatani en el *afterword* del segundo tomo de antologías: ya no queda nada más por hacer. Los personajes ya no dan para más, pero en el mejor sentido posible, puedes
      imaginar mil historias y lo que quieras, pero la esencia de cada uno ya se da por finalizada de forma muy satisfactoria.
    - >
      Le tengo un gran cariño a *Bloom Into You*, porque me hizo sentir verdadera satisfacción al terminarla, y, porque por primera vez pude terminar un manga que me haya encantando
      mi hambre de más totalmente saciada.

- titulo: "賭博黙示録カイジ (Gambling Apocalypse: Kaiji)"
  orden: "gambling apocalypse"
  creditos:
    - nombre: "福本 伸行 (Fukumoto Nobuyuki)"
      rol: "Historia y Dibujo"
  tipo: "Manga"
  categoria:
  - "Favoritos"
  generos:
    - "Acción"
    - "Drama"
    - "Psicológico"
    - "Apuestas"
    - "Suspenso"
  estado: "Finalizado (158 capítulos compilados en 13 tomos, 1° parte)"
  imagen: "/assets/images/animanga/Kaiji.jpg"
  enlace: "https://myanimelist.net/manga/3572/Tobaku_Mokushiroku_Kaiji"
  comentario:
    - >
      Fuera de todo el chiste que hay actualmente sobre las apuestas, la adicción a estas es realmente peligrosa y puede deteriorar la mente de cualquier persona en muy poco tiempo,
      aún más cuando tienes en cuenta que quienes caen en este vicio son personas que ya parten de una situación económica precaria y se encuentran desesperadxs. Aquí conocemos a Kaiji,
      un joven en sus 20s que desde que llegó a Tokyo no ha hecho más que gastar su vida y su dinero en placeres momentáneos y apuestas de bajo riesgo, con trabajos sueltos por aquí y
      por allá pero sin renta estable. Kaiji es muy consciente de la situación que lleva desde hace años y se detesta a si mismo por ser incapaz de cambiar para bien, y en cambio
      dirige su frustración a la gente que tiene dinero y asume que es por pura suerte.
    - >
      El cambio que Kaiji quería llegará en la forma de un Yakuza que viene a cobrar un préstamo en el que él firmo como aval hace un tiempo. Como son la mafia, ya lo tienen fichado a el
      y a su familia, y para poner el clavo en el ataúd, la persona por la que Kaiji firmó desapareció sin haber pagado una sola cuota del préstamo, que sumado a tasas de interés altísimas
      resulta en que nuestro joven no tiene forma humana de pagar su nueva deuda. Pero todo tiene un lado bueno, cierto? Este yakuza hace uso de su labia para convener a Kaiji de subirse
      a un crucero de una noche, en la cual entrará como un hombre endeudado y, con algo de suerte y habilidad, saldrá siendo millonario, claramente apostando, pero si por lo que sea no
      logra pagar su deuda al finalizar la noche, será llevado a un campo de trabajo forzado a pagar por quien sabe cuantos años.
    - >
      *Gambling Apocalypse: Kaiji* no tiene reparos en mostrar los lados más rastreros y detestables del ser humano, al final cuando te encuentras apostando tu propia libertad tarde o
      temprano terminarás cediendo a la presión y te convertirás en alguien egoísta y maligno. Kaiji no es la excepción, no deja de ser una persona común y corriente, pero tiene algo 
      que los demás no, una capacidad de pensar con claridad y sentido común en momentos donde lo único que quieres es que ocurra un milagro. Aún así Kaiji cede a los encantos de la 
      adrenalina y se vuelve más adicto aún a las apuestas, vemos el descenso a la locura de varios personajes con el pasar de los capítulos y nuestro protagonista es el último en caer...
      dando paso a un manga que se sigue publicando, aunque actualmente se encuentra en *hiatus*.
    - >
      El punto fuerte de esta serie es sin duda el factor psicológico, pero los juegos originales que implementa en las apuestas también son dignos de estudio y enriquecen mucho más
      la historia y el aspecto estratégico de cada arco.

- titulo: "ソラニン (Solanin)"
  orden: "soranin"
  creditos:
    - nombre: "浅野 いにお (Asano Inio)"
      rol: "Historia y Dibujo"
  tipo: "Manga"
  categoria:
  - "Favoritos"
  generos:
    - "Maduración"
    - "Drama"
    - "Romance"
    - "Slice of Life"
  estado: "Finalizado (28 capítulos compilados en 2 tomos + 1 capítulo extra)"
  imagen: "/assets/images/animanga/Solanin.jpg"
  enlace: "https://myanimelist.net/manga/3731/Solanin"
  comentario:
    - >
      No hay clase ni lección moral que nos enseñe a manejar la vida adulta, más cuando apenas sales del colegio/universidad o te independizas el primer sentimiento que se te viene
      a la cabeza es "incerteza". Un día estás en tu casa, con tus sueños y metas, y al siguiente estás en un lugar ajeno que debes transformar en tuyo, con una pila de responsabilidades
      que nunca se te habían pasado por la cabeza, y con la necesidad de que esos sueños lejanos de alguna manera te paguen las cuentas hoy.
    - > 
      <a href="https://youtu.be/xZD1B1TskXs?si=CsmGZfeFYApUY8_O" target="_blank" rel="noopener noreferrer">*Soranin*</a> nos presenta a una pareja de adultos jóvenes 
      independientes en Meiko y Taneda. La primera está harta de su trabajo de oficina y renuncia, dejando toda la carga económica
      en Taneda cuando sus ahorros se acaben eventualmente, y es en este desempleo que Meiko piensa en el futuro, la incerteza, el miedo y el no saber que hacer con su vida. Taneda por 
      su parte tiene un trabajo de medio tiempo y problemáticas a tiempo completo, el siempre ha querido dedicarse a la música y tiene su banda junto a unos amigos de la uni, pero no
      sabe como afrontar a Meiko con esto porque sabe que necesita una fuente estable de dinero para vivir y no quiere preocupar más a su pareja que ya tiene suficiente en su mente.
    - >
      A lo largo de la historia vemos como esta pareja, y el grupo de amigxs que les rodea, decide como afrontar la vida adulta, mientras ellxs mismxs van madurando y asimilando lo que
      tienen en su cabeza y corazón con lo que ven sus ojos. Una historia llena de emoción y que invita a la reflexión, más si te encuentras en una situación parecida a la de lxs
      protagonistas. *Escrito con fragmentos sueltos de la historia que recuerdo de la última vez que lo leí, lo actualizaré*

- titulo: "僕の心のヤバイやつ (The Dangers in My Heart)"
  orden: "bokuyaba"
  creditos:
    - nombre: "桜井 のりお (Sakurai Norio)"
      rol: "Historia y Dibujo"
  tipo: "Manga"
  categoria:
  - "Favoritos"
  generos:
    - "Comedia Romántica"
    - "Psicológico"
    - "Escolar"
  estado: "En serialización"
  imagen: "/assets/images/animanga/BokuYaba.jpg"
  enlace: "https://myanimelist.net/manga/112807/Boku_no_Kokoro_no_Yabai_Yatsu"
  comentario:
    - >
      Comedia romántica y psicológica? Si se te hace raro es porque lo es, pero tiene una explicación. Y es que *BokuYaba* se presentaba como una "comedia libre de romance", pero
      termino siendo un romance que ahoda en temas "psicológicos".
    - >
      Ichikawa Kyoutaro es un prepuberto que sufre de delirios de grandeza e idealización de cometer asesinato múltiple, esto como mecanismo de defensa para evitar salir herido como
      resultado de entablar relaciones con sus compañerxs, porque sufre de baja autoestima. En su estado de desilusión sueña por matar a una chica en especial, Yamada Anna, quien es
      la más popular del colegio (razón por la que la odia tanto), pero la verdad es que simplemente le gusta, pero para no tener que enfrentar estos sentimientos, nuestro chavalín
      se dedica a observar a Yamada a la distancia para ver que es lo que tiene que la hace tan popular. Hasta aquí tenemos una comedia escolar de lo más normalita, el giro se genera
      cuando Yamada empieza a acercarse a el y se empiezan a relacionar, esto lleva a que Ichikawa admita finalmente que le gusta.
    - >
      A partir de este punto la comedia pasa a segundo plano, en favor de centrarnos en las historias personales de Yamada e Ichikawa, además de introducir más personajes de apoyo. En
      este punto es donde empieza a relucir la escritura de Sakurai, y con esto nos convertimos en testigxs del desarrollo de personaje que tiene Ichikawa, como va madurando y cambiando para mejor, mientras
      se va descubriendo a si mismo y comienza a ver la vida con otros ojos, ojos que solo miran a Yamada. Ella, por su parte, también es una gran protagonista por mérito propio y es
      de las mejores que he visto en cuanto a mangas de romance heterosexual.
    - >
      Sin duda una historia muy emotiva, muy linda y que nos demuestra que incluso un chaval de 13-14 años es capaz de superar a cualquier protagonista básico de cualquier harem simplón
      lleno de fanservice.

