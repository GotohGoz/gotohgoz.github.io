- artista: "ASIAN KUNG-FU GENERATION"
  titulo: "君繋ファイブエム (Connected to You 5M)"
  etiquetas:
    - "Álbum"
    - "2003"
    - "J-Rock"
    - "Rock Alternativo"
    - "Pop-Punk"
    - "Indie Rock"
  imagen: "/assets/images/music/AKFG_Album.jpg"
  enlace: "https://music.apple.com/cl/album/君繋ファイブエム/1536363189"
  parrafos: 
    - >
      No necesitan presentación, son mi banda favorita de todos los tiempos y de las más conocidas del rock japonés. Desde sus inicios con un estilo y 
      sonido muy único que han madurado con los años, pasando por etapas más experimentales para llegar al punto más pulido que podemos escuchar en sus últimos lanzamientos.
    - >  
      Algo que siempre me ha gustado de *Ajikan* son sus letras tan metafóricas y poéticas, siento que le dan un giro único dependiendo de quién la escuche pero el mensaje siempre 
      llega. Junto a arreglos simples en las rítmicas que hacen destacar más tanto a la voz suave, emotiva y raspante de Gotoh, como a la guitarra de Kita. Es una combinación 
      que siempre disfruto de escuchar, pero eso no hace que las líneas de bajo y la batería no sean increibles, no dejan de ser el esqueleto de cada canción, y tanto Ijichi como
      Yamada deslumbran también si te paras a escucharlos detenidamente.
    - >
      Pongo como recomendación *君繋ファイブエム* así como podría haber puesto cualquier álbum, EP o *single*, todos son un deleite sonoro y merecen ser escuchados. Es de las pocas
      veces (por no decir la única) en la que tengo tantas dificultades para hacer una recomendación, así que de paso les diré que escuchen su último EP <a href="https://music.apple.com/cl/album/フジエダ-ep/1878304883"
      target="_blank" rel="noopener noreferrer">*フジエダ EP*</a>, que es una síntesis y unión entre el sonido más maduro que tienen ahora junto a la energía que los caracterizó y distinguió en sus inicios. 
    - >
      *Ajikan* es mucho más que simplemente "la banda del opening 2 de Naruto", tienen una discografía exquisita llena de variaciones en sonido y letras, pero siempre manteniendo
      su esencia, no por nada son tan famosos en este lado del charco. Si no los han escuchado a fondo, háganlo y después me lo agradecen.

- artista: "ELLEGARDEN"
  titulo: "The End of Yesterday"
  etiquetas:
    - "Álbum"
    - "2022"
    - "J-Rock"
    - "Rock Alternativo"
    - "Pop-Punk"
    - "Punk Rock"
  imagen: "/assets/images/music/ELLEGARDEN_Album.jpg"
  enlace: "https://music.apple.com/cl/album/the-end-of-yesterday/1659013026"
  parrafos:
    - >
      Algo más áspero y crudo, y eso me encanta. *Ellegarden* es una de esas bandas que solamente hace falta una canción para conquistarte, en el caso de este álbum diría que ese
      honor se lo lleva *Goodbye Los Angeles*, pero tampoco puedo quitarle mérito a la canción que me llevó a descubirlos en un inicio, *Supernova* del álbum <a href="https://music.apple.com/cl/album/pepperoni-quattro/1058302637"
      target="_blank" rel="noopener noreferrer">*Pepperoni Quattro*</a>, asegúrate de escucharlo también!
    - >
      La mejor forma de describirlos que se me ocurre es: "una versión más ruda y adulta de *blink-182*", quizás no sea muy descriptiva o correcta,
      por lo que eres libre de corregirme si así lo deseas. De todas formas son una gran banda con una discografía fantástica y letras que en temas de desamores dirían que son
      de mis favoritas de todos los tiempos.

- artista: "blink-182"
  titulo: "Enema of The State"
  etiquetas:
    - "Álbum"
    - "1999"
    - "Rock"
    - "Rock Alternativo"
    - "Pop-Punk"
    - "Punk Rock"
  imagen: "assets/images/music/blink-182_Album.png"
  enlace: "https://music.apple.com/cl/album/enema-of-the-state/1440839912"
  parrafos:
    - >
      Desde que era pequeño, uno de mis hermanos escuchaba mucho el álbum <a href="https://music.apple.com/cl/album/california-deluxe-edition/1709471918" target="_blank" rel="noopener noreferrer">*California*</a>,
       y desde ese momento quedé fascinado por el ritmo y las guitarras (tenía como 12 años así 
      que de la letra no entendía nada), pero por alguna razón siempre pensé que eran los *Red Hot Chili Peppers*. No fue hasta hace poco que pude encontrarlos y redescubrir no
      solo *California*, sino que el resto de sus gran discografía.
    - >
      Pese a esto y a los buenos recuerdos de mi infancia, prefiero sus primeros temas, cuando la irreverencia abundaba y la adolescencia nos hacía sentir que nadie nos entendía, al
      menos hasta que *blink* sacaba un tema que nos hizo sentir tan representadxs que ahora da hasta un poco de miedo.
    - >
      *blink-182* sin duda supo aprovechar muy bien sus mayores éxitos y formar un legado de canciones, que, a pesar de no haber crecido con los años como nosotrxs, 
      si envejecieron de una manera increíble y mantienen ese espíritu rebelde y lleno de energía que no debemos olvidar. 

- artista: "MAN WITH A MISSION"
  titulo: "Chasing The Horizon"
  etiquetas:
    - "Álbum"
    - "2018"
    - "J-Rock"
    - "Rock Alternativo"
    - "Rap Metal"
    - "Hard Rock"
  imagen: "assets/images/music/MWAM_Album.jpg"
  enlace: "https://music.apple.com/cl/album/chasing-the-horizon/1538282565"
  parrafos:
    - >
      No es necesario ser *furry* para poder disfrutar de estos lobos. Tienen una mezcla muy fresca de rock "moderno" podríamos decir, con letras rebeldes y un toque preciso
      que le da DJ Santa Monica a la mezcla final que da como resultado un sonido muy distintivo y que me gusta mucho.
    - >
      Les recomiendo *Chasing The Horizon* porque tiene una mezcla muy buena de temas variados y siento que resume muy bien la esencia de *MWAM*. Sin duda debes echarles un vistazo si te gusta
      el rock nippon, o el rock en general, o la música como un todo. Tu solo escuchalos, sé que no te arrepentirás.