title: "GotohGoz"
description: "Mi pequeño rincón en los internetes."
lang: "es-CL"

url: "https://gotohgoz.github.io"
baseurl: ""

timezone: "America/Santiago"

plugins:
  - jekyll-paginate

paginate: 5
paginate_path: "/blog/page:num/"

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: "/blog/:title/"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .bundle/
  - vendor/

include:
  - .well-known
